# Mục đích: khai báo cho dbt biết 4 bảng nguồn của thelook_ecommerce nằm ở đâu,
#           để các model sau gọi bằng source('thelook', 'tên_bảng') thay vì viết tên đầy đủ.
# Giống việc ghi rõ project.dataset.table trong FROM, nhưng khai báo một lần ở đây
# Dùng 2 dấu cách để thụt dòng, không dùng phím Tab

#version: 2                              # dòng bắt buộc của file cấu hình dbt, chép nguyên

#sources:
#  - name: thelook                       # tên gọi tắt của nguồn; chữ này sẽ viết trong source('thelook', ...)
#    database: bigquery-public-data      # trong BigQuery, "database" của dbt chính là PROJECT
#    schema: thelook_ecommerce           # "schema" của dbt chính là DATASET
#    tables:                             # danh sách bảng mình sẽ dùng
#      - name: order_items
#      - name: orders
#      - name: products
#      - name: users

# Mục đích: khai báo nguồn dữ liệu thô của dbt và thêm mô tả để dbt docs hiển thị.
version: 2

sources:
  - name: thelook
    description: "Bộ dữ liệu công khai thelook_ecommerce của Google (dữ liệu mô phỏng), đọc trực tiếp, không sao chép."
    database: bigquery-public-data
    schema: thelook_ecommerce
    tables:
      - name: order_items
        description: "Mỗi dòng là một mặt hàng trong một đơn. Nguồn của fct_net_sales."
      - name: orders
        description: "Mỗi dòng là một đơn hàng. Chưa dùng trong mart (không có product_id)."
      - name: products
        description: "Mỗi dòng là một sản phẩm. Nguồn của dim_products."
      - name: users
        description: "Mỗi dòng là một khách hàng. Chưa dùng trong mart."