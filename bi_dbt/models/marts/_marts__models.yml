# Mục đích: khai báo test tự động cho 2 bảng mart.
# Mỗi test là một câu SQL do dbt tự viết; test ĐẠT khi câu SQL đó trả về 0 dòng.
# Mục đích: giữ 7 test của Ngày 1 và thêm description cho 2 mart để dbt docs hiển thị.
# Lưu ý: dùng dấu cách để thụt dòng (không dùng Tab); mô tả đặt trong ngoặc kép vì có dấu hai chấm.


#models:                      # tầng 1: danh sách bảng (model)
#  - name: dim_products       #   tên bảng: phải trùng tên file .sql
#    description: "..."       #   mô tả cả bảng (1 dòng là gì)
#    columns:                 # tầng 2: danh sách cột của bảng này
#      - name: product_id     #   tên cột: phải trùng tên cột trong SQL
#        description: "..."   #   mô tả cột
#        data_tests:          # tầng 3: test gắn vào cột (của Ngày 1)
#          - unique

version: 2

models:
  - name: dim_products
    description: "Dimension sản phẩm. Grain: 1 dòng = 1 sản phẩm. Nguồn: thelook_ecommerce.products, qua stg_thelook__products."
    columns:
      - name: product_id
        description: "Khóa chính của sản phẩm. Duy nhất, không NULL."
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "Tên sản phẩm."
      - name: category
        description: "Danh mục sản phẩm, dùng để nhóm báo cáo."
      - name: brand
        description: "Thương hiệu."
      - name: department
        description: "Bộ phận bán hàng. Chỉ có hai giá trị: Women, Men."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Women', 'Men']
      

  - name: fct_net_sales
    description: "Fact doanh thu thực tế. Grain: 1 mặt hàng trong 1 đơn. Quy tắc: chỉ tính đơn có status = 'Complete'."
    columns:
      - name: order_item_id
        description: "Khóa chính: mã mặt hàng trong đơn. Duy nhất, không NULL."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Mã đơn hàng. Một đơn có thể có nhiều dòng."
      - name: user_id
        description: "Mã khách hàng."
      - name: product_id
        description: "Khóa ngoại sang dim_products.product_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: order_date
        description: "Ngày đặt hàng (date của created_at)."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: sale_price
        description: "Giá bán của mặt hàng. Tổng cột này là doanh thu."
      - name: cost
        description: "Giá vốn của mặt hàng."
      - name: gross_profit
        description: "Lợi nhuận gộp = sale_price - cost."
  

  - name: fct_net_sales_inc
    description: "Doanh thu thực tế dạng incremental. 1 dòng = 1 mặt hàng trong 1 đơn Complete (cùng grain với fct_net_sales). Lần đầu dựng đủ bảng, các lần sau lấy đơn Complete từ 3 ngày trước ngày mới nhất rồi MERGE theo order_item_id. Lưu ý: MERGE không xóa dòng, nên đơn đã vào bảng rồi đổi trạng thái khác Complete vẫn còn nằm lại."
    columns:
      - name: order_item_id
        description: "Khóa của bảng, là order item trong nguồn thelook."
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "Khóa nối sang dim_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id


  - name: dim_date
    description: "Bảng lịch. 1 dòng = 1 ngày, từ 2019-01-01 đến 2027-12-31. Tạo bằng SQL, không đọc bảng nguồn."
    columns:
      - name: date_day
        description: "Ngày (kiểu DATE), khóa chính. Nối với fct_net_sales.order_date."
        data_tests:
          - unique
          - not_null